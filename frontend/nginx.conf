server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API и SSE → бэкенд (префикс /api срезается).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;      # обязательно для SSE-стрима
        proxy_cache off;
        proxy_read_timeout 3600s; # длинные стримы
    }

    # SPA: любые пути отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
